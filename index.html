<script>
  const swiper = new Swiper('.mySwiper', {
    // Автопрокрутка (главное!)
    autoplay: {
      delay: 3000,        // Интервал между слайдами (мс) — 3 секунды
      disableOnInteraction: false,  // Не отключать автопрокрутку после ручного переключения
      pauseOnMouseEnter: true,      // Пауза при наведении мыши
    },
    
    // Бесконечная прокрутка (зацикливание)
    loop: true,
    
    // Скорость анимации переключения
    speed: 800,
    
    // Кнопки навигации
    navigation: {
      nextEl: '.swiper-button-next',
      prevEl: '.swiper-button-prev',
    },
    
    // Пагинация (точки)
    pagination: {
      el: '.swiper-pagination',
      clickable: true,    // Точки кликабельны
    },
    
    // Эффект переключения (опционально)
    effect: 'slide',      // 'slide', 'fade', 'cube', 'coverflow', 'flip'
    
    // Включить перетаскивание мышкой/пальцем
    grabCursor: true,
  });
</script>
